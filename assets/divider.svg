<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff00aa" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ff00aa"/>
      <stop offset="0.7" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-300%" width="110%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="11" width="1000" height="2" fill="url(#g)" filter="url(#glow)"/>
  <rect x="-120" y="9" width="120" height="6" rx="3" fill="url(#pulse)" opacity="0.9" filter="url(#glow)">
    <animate attributeName="x" values="-120;1000" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="490" y="6" width="20" height="12" fill="#0b0d10" stroke="#00ff9c" stroke-width="1.5" transform="rotate(45 500 12)">
    <animate attributeName="stroke" values="#00ff9c;#ff00aa;#00ff9c" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>

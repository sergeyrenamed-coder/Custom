<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">SERGEY — Web Developer and RNMDTEAM founder</title>
  <desc id="desc">Monochrome editorial hero with a clean typographic R monogram and subtle motion.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#777" opacity=".34"/></pattern>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#aaa"/></linearGradient>
    <clipPath id="markClip"><rect x="930" y="66" width="300" height="210"/></clipPath>
  </defs>
  <style>
    .meta{font:11px Arial,Helvetica,sans-serif;letter-spacing:3px;fill:#8b8b8b}
    .title{font:800 150px Arial,Helvetica,sans-serif;letter-spacing:-10px;fill:url(#name)}
    .sub{font:600 16px Arial,Helvetica,sans-serif;letter-spacing:4px;fill:#eee}
    .small{font:10px monospace;letter-spacing:2px;fill:#666}
    .pulse{animation:pulse 4.8s ease-in-out infinite}
    .sweep{animation:sweep 9s linear infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(-130px)}100%{transform:translateX(330px)}}
    @media (prefers-reduced-motion:reduce){.pulse,.sweep{animation:none}}
  </style>
  <rect width="1280" height="340" fill="#080808"/>
  <rect x="1" y="1" width="1278" height="338" fill="none" stroke="#373737"/>
  <path d="M40 55H1240M40 294H1240" stroke="#333"/>
  <text class="meta" x="42" y="34">RNMD / PERSONAL PROFILE</text>
  <text class="meta" x="1238" y="34" text-anchor="end">INDEPENDENT DEVELOPER</text>
  <text class="title" x="38" y="205">SERGEY</text>
  <text class="sub" x="50" y="245">WEB DEVELOPER  /  FOUNDER OF RNMDTEAM</text>
  <text class="small" x="50" y="319">DESIGN  —  BUILD  —  ITERATE</text>
  <text class="small" x="1238" y="319" text-anchor="end">001 / 007</text>
  <rect x="920" y="55" width="320" height="239" fill="url(#dots)" opacity=".62"/>
  <g clip-path="url(#markClip)">
    <circle cx="1085" cy="165" r="100" fill="none" stroke="#454545"/>
    <circle cx="1085" cy="165" r="78" fill="none" stroke="#303030"/>
    <text x="1085" y="232" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="188" font-weight="600" letter-spacing="-12">R</text>
    <path d="M980 66V264M1190 66V264" stroke="#555" stroke-dasharray="2 8"/>
  </g>
  <circle class="pulse" cx="1238" cy="73" r="4" fill="#fff"/>
  <rect x="40" y="291" width="1200" height="2" fill="#282828"/>
  <rect class="sweep" x="40" y="290" width="130" height="3" fill="#eee" opacity=".48"/>
</svg>
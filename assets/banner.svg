<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff00aa"/>
      <stop offset="1" stop-color="#00ff9c"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14061a"/>
      <stop offset="0.5" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#04150f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff9c" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeclip">
      <rect x="140" y="188" height="40" width="0">
        <animate attributeName="width" values="0;560;560;0" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    text { font-family: 'Courier New', Consolas, monospace; font-weight: 700; }
    .name { font-size: 118px; letter-spacing: 6px; }
    .pink { fill: #ff00aa; animation: glitchA 3.2s infinite steps(1); }
    .cyan { fill: #00e5ff; animation: glitchB 3.2s infinite steps(1); }
    .main { fill: url(#g); }
    .sub  { font-size: 22px; fill: #00ff9c; }
    .cur  { fill: #00ff9c; animation: blink 1s infinite steps(1); }
    .tag  { font-size: 12px; fill: #ff00aa; letter-spacing: 3px; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes glitchA {
      0%,88% { transform: translate(-3px,0); opacity: .55 }
      90% { transform: translate(-12px,-3px); opacity: .9 }
      93% { transform: translate(8px,2px); opacity: .9 }
      96% { transform: translate(-6px,0); opacity: .7 }
      100% { transform: translate(-3px,0); opacity: .55 }
    }
    @keyframes glitchB {
      0%,88% { transform: translate(3px,0); opacity: .55 }
      90% { transform: translate(12px,3px); opacity: .9 }
      93% { transform: translate(-8px,-2px); opacity: .9 }
      96% { transform: translate(6px,0); opacity: .7 }
      100% { transform: translate(3px,0); opacity: .55 }
    }
  </style>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>

  <!-- corner brackets -->
  <g fill="none" stroke="#00ff9c" stroke-width="2" filter="url(#glow)">
    <polyline points="12,40 12,12 40,12"/>
    <polyline points="960,12 988,12 988,40"/>
    <polyline points="12,220 12,248 40,248"/>
    <polyline points="960,248 988,248 988,220"/>
  </g>

  <text class="tag" x="30" y="34">// RNMDTEAM.SYS</text>
  <text class="tag" x="970" y="34" text-anchor="end">
    SIGNAL: ONLINE
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- glitch name -->
  <g filter="url(#glow)">
    <text class="name pink" x="500" y="150" text-anchor="middle">SERGEY</text>
    <text class="name cyan" x="500" y="150" text-anchor="middle">SERGEY</text>
    <text class="name main" x="500" y="150" text-anchor="middle">SERGEY</text>
  </g>

  <!-- typing subtitle -->
  <g clip-path="url(#typeclip)">
    <text class="sub" x="140" y="212">&gt; Web Developer | Founder of RNMDTEAM</text>
  </g>
  <rect class="cur" x="720" y="194" width="12" height="24">
    <animate attributeName="x" values="140;700;700;140" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- scanline -->
  <rect x="0" y="-6" width="1000" height="4" fill="#00ff9c" opacity="0.18">
    <animate attributeName="y" values="-6;262" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom neon line -->
  <rect x="0" y="256" width="1000" height="4" fill="url(#g)" filter="url(#glow)"/>
</svg>
